[package]
name = "trackbench"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSGeometry"] }
objc2-app-kit = { workspace = true, features = ["NSResponder", "NSView", "NSWindow", "NSGraphics", "NSCursor", "NSTrackingArea", "objc2-core-foundation"] }
sidestep.workspace = true
