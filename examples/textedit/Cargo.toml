[package]
name = "textedit"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSTimer", "NSDate", "NSDictionary", "NSGeometry", "NSNotification", "NSZone", "NSRange", "NSAttributedString", "NSUndoManager", "block2"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSColor", "NSFont", "NSFontDescriptor", "NSAttributedString", "NSEvent", "NSScrollView", "NSClipView", "NSRunningApplication", "NSText", "NSTextView", "NSTextStorage", "NSLayoutManager", "NSTextContainer", "NSTextInputClient", "NSParagraphStyle", "NSTextTable", "objc2-core-foundation"] }
sidestep.workspace = true
