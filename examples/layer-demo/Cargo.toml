[package]
name = "layer-demo"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSThread", "NSTimer", "NSDate", "NSArray", "NSValue", "NSGeometry", "NSRunLoop", "block2", "objc2-core-foundation"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSColor", "NSRunningApplication", "NSControl", "NSTextField", "NSFont", "NSText", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGColor", "CGPath", "bitflags", "objc2"] }
objc2-quartz-core = { workspace = true, features = ["CAAnimation", "CABase", "CAGradientLayer", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAShapeLayer", "CATransaction", "CATransform3D", "bitflags", "objc2-core-foundation", "objc2-core-graphics"] }
sidestep.workspace = true
