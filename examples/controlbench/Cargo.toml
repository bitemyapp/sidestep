[package]
name = "controlbench"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSGeometry", "NSArray"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSView", "NSControl", "NSCell", "NSActionCell", "NSButton", "NSButtonCell", "NSTextField", "NSTextFieldCell", "NSSlider", "NSSliderCell", "NSSegmentedControl", "NSSegmentedCell", "NSLayoutConstraint", "NSFont", "objc2-core-foundation"] }
sidestep.workspace = true
