[package]
name = "textkit2bench"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSGeometry", "NSRange", "NSAttributedString", "NSDictionary"] }
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSView", "NSFont", "NSFontDescriptor", "NSScrollView", "NSClipView", "NSText", "NSTextView", "NSTextStorage", "NSTextContainer", "NSTextInputClient", "NSAttributedString", "NSTextLayoutManager", "NSTextContentManager", "NSTextElement", "NSTextRange", "NSTextLayoutFragment", "NSTextViewportLayoutController", "objc2-core-foundation", "block2"] }
sidestep.workspace = true
