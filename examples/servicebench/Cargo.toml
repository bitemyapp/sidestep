[package]
name = "servicebench"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSNotification", "NSOperation", "block2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "block2", "CFRunLoop", "CFDate", "CFString"] }
sidestep.workspace = true
