[package]
name = "sidestep-core-services"
description = "CoreServices for Sidestep: file system event streams and file metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
sidestep-foundation.workspace = true
objc2 = { workspace = true, features = ["gnustep-2-1"] }
objc2-foundation = { workspace = true, features = ["gnustep-2-1", "NSArray", "NSDictionary", "NSDate", "NSValue", "NSString", "NSURL"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "CFArray", "CFString", "CFRunLoop"] }
dispatch2 = "0.3.1"
block2.workspace = true
notify = { version = "8", default-features = false }

[dev-dependencies]
objc2-core-services = { workspace = true, features = ["FSEvents", "dispatch2", "Metadata", "MDItem"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFNumber", "CFDictionary", "CFArray", "CFString"] }
