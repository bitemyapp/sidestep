[package]
name = "sidestep-appkit"
description = "AppKit for Sidestep: views, windows and events in Rust, rendered on a separate thread through Wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
sidestep-runtime.workspace = true
sidestep-foundation.workspace = true
objc2 = { workspace = true, features = ["gnustep-2-1"] }
block2 = { workspace = true, features = ["gnustep-2-1"] }
objc2-foundation = { workspace = true, features = ["gnustep-2-1", "NSObject", "NSString", "NSDictionary", "NSGeometry", "NSNotification", "NSTimer", "NSDate", "NSZone", "block2"] }
objc2-app-kit = { workspace = true, features = ["gnustep-2-1", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSColor", "NSFont", "NSFontDescriptor", "NSBezierPath", "NSStringDrawing", "NSAttributedString", "NSEvent", "NSScrollView", "NSClipView", "NSRunningApplication", "objc2-core-foundation"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
fontdue = "0.9"
