[package]
name = "sidestep-appkit"
description = "AppKit for Sidestep: views, windows and events in Rust, rendered on a separate thread through Wayland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
sidestep-runtime.workspace = true
sidestep-foundation.workspace = true
objc2 = { workspace = true, features = ["gnustep-2-1"] }
block2 = { workspace = true, features = ["gnustep-2-1"] }
objc2-foundation = { workspace = true, features = ["gnustep-2-1", "NSObject", "NSString", "NSDictionary", "NSGeometry", "NSNotification", "NSTimer", "NSDate", "NSZone", "NSRange", "block2", "NSArray", "NSData", "NSValue", "NSAffineTransform", "NSURL", "objc2-core-foundation", "NSRunLoop", "NSUserDefaults", "NSBundle", "NSObjCRuntime", "NSIndexSet", "NSEnumerator", "NSAttributedString", "NSLocale", "NSError"] }
objc2-app-kit = { workspace = true, features = ["gnustep-2-1", "NSApplication", "NSResponder", "NSView", "NSWindow", "NSGraphics", "NSColor", "NSFont", "NSFontDescriptor", "NSBezierPath", "NSStringDrawing", "NSAttributedString", "NSEvent", "NSScrollView", "NSClipView", "NSRunningApplication", "objc2-core-foundation", "NSPasteboard", "NSText", "NSCursor", "NSTrackingArea", "NSTextInputContext", "NSParagraphStyle", "NSCell", "NSPasteboardItem", "NSDragging", "NSDraggingItem", "NSScreen", "block2", "NSGraphicsContext", "NSImageRep", "NSBitmapImageRep", "NSCustomImageRep", "NSColorSpace", "NSAppearance", "NSAffineTransform", "NSColorList", "NSImage", "NSGradient", "NSShadow", "NSAnimation", "NSAnimationContext", "NSControl", "NSImageView", "NSVisualEffectView", "NSPanel", "NSViewController", "NSWindowController", "NSNib", "NSUserInterfaceItemIdentification", "NSUserInterfaceLayout", "NSLayoutConstraint", "NSLayoutAnchor", "NSLayoutGuide", "NSStackView", "NSSplitView", "NSTabView", "NSTabViewItem", "NSTableView", "NSTableColumn", "NSTableRowView", "NSTableCellView", "NSTableHeaderView", "NSTextStorage", "NSLayoutManager", "NSTextContainer", "NSTextView", "NSTextTable", "NSTextInputClient", "objc2-core-graphics", "objc2-quartz-core", "objc2-core-text", "NSActionCell", "NSButton", "NSButtonCell", "NSTextField", "NSTextFieldCell", "NSSecureTextField", "NSSearchField", "NSSearchFieldCell", "NSBox", "NSProgressIndicator", "NSSegmentedControl", "NSSegmentedCell", "NSStepper", "NSStepperCell", "NSSlider", "NSSliderCell", "NSSwitch", "NSAccessibilityConstants", "NSScroller", "NSMenu", "NSMenuItem", "NSUserInterfaceValidation", "NSPopUpButton", "NSPopUpButtonCell", "NSMenuItemCell", "NSAlert", "NSHelpManager", "NSSavePanel", "NSOpenPanel", "NSWorkspace", "NSImageCell", "NSFontManager", "NSTextContentManager", "NSTextElement", "NSTextRange", "NSTextLayoutManager", "NSTextLayoutFragment", "NSTextLineFragment", "NSTextViewportLayoutController", "NSTextSelection", "NSTextSelectionNavigation"] }
# CoreGraphics, QuartzCore, CoreText and ImageIO, with the features apps use.
# They build off Apple with objc2's fork (tools/objc2-overlay), and AppKit's
# methods with their types (NSColor's CGColor, NSView's layer and so on) come
# with them. Sidestep implements CoreGraphics (src/coregraphics); QuartzCore,
# CoreText and ImageIO come next (tests/framework_types.rs checks that they
# compile).
objc2-core-graphics = { workspace = true, features = ["CGAffineTransform", "CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGDataConsumer", "CGDataProvider", "CGDirectDisplay", "CGEventTypes", "CGFont", "CGFunction", "CGGeometry", "CGGradient", "CGImage", "CGPath", "CGPattern", "CGShading", "bitflags", "block2", "objc2"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CFBase", "CFCGTypes", "CFArray", "CFData", "CFDictionary", "CFString", "CFURL"] }
objc2-quartz-core = { workspace = true, features = ["gnustep-2-1", "CAAnimation", "CABase", "CADisplayLink", "CALayer", "CAMediaTiming", "CAMediaTimingFunction", "CAOpenGLLayer", "CATransaction", "CATransform3D", "bitflags", "objc2-core-foundation", "objc2-core-graphics"] }
objc2-core-text = { workspace = true, features = ["CTFont", "CTFontDescriptor", "CTFontManager", "CTLine", "CTRun", "CTStringAttributes", "SFNTLayoutTypes", "bitflags", "objc2-core-graphics"] }
objc2-image-io = { workspace = true, features = ["CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# Path geometry for NSBezierPath: bounds, winding, flattening.
kurbo = { version = "0.13", default-features = false, features = ["std"] }
# Image files, all in pure Rust: PNG, JPEG (zune-jpeg), GIF, WebP, BMP,
# TIFF and ICO.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
# Keymaps and compose sequences, in pure Rust: no libxkbcommon at build or
# run time.
kbvm = { version = "0.2", default-features = false, features = ["compose"] }
# Themed cursors, for compositors without wp_cursor_shape_v1.
wayland-cursor = "0.31"
# Non-blocking clipboard pipes; already built for the Wayland crates.
rustix = { version = "1", default-features = false, features = ["std"] }
# Text: parley lays out (bidi, line breaking, shaping with harfrust),
# fontique finds fonts through the system's fontconfig, loaded at run time
# with dlopen, and swash rasterizes glyphs. See docs/architecture.md.
parley = { version = "0.11.1", default-features = false, features = ["std", "system"] }
fontique = { version = "0.11.1", default-features = false, features = ["std", "system", "fontconfig-dlopen"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
swash = { version = "0.2.10", default-features = false, features = ["std", "scale", "render"] }
# Routes ICU's diagnostics (parley's segmenter has no CJK dictionary, and
# says so on every CJK line in debug builds) to the `log` crate.
icu_provider = { version = "2.1", default-features = false, features = ["logging"] }
# Auto Layout's constraint solver (Cassowary), pure Rust.
kasuari = { version = "0.4.12", default-features = false, features = ["std"] }
# Text editing: paragraphs' attribute runs inline, and word and
# character boundaries for selection and commands (both already built for
# parley).
smallvec = "1.13"
# Finding paragraph separators in text a storage takes in whole.
memchr = { version = "2.7", default-features = false, features = ["std"] }
icu_segmenter = { version = "2.1", default-features = false, features = ["compiled_data"] }
# Which characters are emoji, to draw them in color (compiled into the binary).
icu_properties = { version = "2.1", default-features = false, features = ["compiled_data"] }

# Drag and drop state, driven through testing hooks (Linux only).
[[test]]
name = "dnd_state"
harness = false

# The clipboard and screens under a compositor (see the file).
[[test]]
name = "wayland_system"
harness = false

# Input and windows through the null render thread; AppKit belongs to the
# main thread, which the test harness doesn't run on.
[[test]]
name = "linux_events"
harness = false

# Menus tracked through the null render thread, and panels and the
# workspace with stand-ins for the desktop (see the files).
[[test]]
name = "menus"
harness = false

[[test]]
name = "panels"
harness = false

# The theme's reference images (src/theme/golden).
[target.'cfg(not(target_vendor = "apple"))'.dev-dependencies]
png = "0.18"
# The items of CoreFoundation, CoreGraphics and QuartzCore that use `libc`
# types only Apple platforms have (Mach ports, cpu_type_t, boolean_t, malloc
# zones), which objc2's fork makes Apple-only: with `libc` on, one that lost
# its gate fails the Linux build (tests/framework_types.rs).
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2", "CFBase", "CFBundle", "CFMachPort", "CFRunLoop"] }
objc2-core-graphics = { workspace = true, features = ["libc", "CGDirectDisplay", "CGDisplayConfiguration", "CGDisplayFade", "CGError", "CGRemoteOperation"] }
objc2-quartz-core = { workspace = true, features = ["libc", "CARemoteLayerClient", "CARemoteLayerServer"] }

# Scroll views' layers and scrolling, through the null render thread.
[[test]]
name = "linux_scroll"
harness = false

# Table rows' background styles, through the null render thread.
[[test]]
name = "linux_table_rows"
harness = false

# Returning from main with windows on screen (Linux only).
[[test]]
name = "linux_exit"
harness = false

# A TextKit 2 text view's viewport: text kept in place while scrolling
# (Linux only).
[[test]]
name = "textkit2_viewport"
harness = false

# Field editor sessions, driven through testing hooks (Linux only).
[[test]]
name = "field_editor"
harness = false

# Image views taking drops and pastes, and animating, through testing hooks
# (Linux only).
[[test]]
name = "image_views"
harness = false

# AppKit's methods with CoreGraphics, QuartzCore and CoreText types, and
# those crates, compile on Linux (default harness; Linux only).
[[test]]
name = "framework_types"

# Live resizes, the Window menu, ordering funnels and posted accessibility
# notifications, through the null render thread (Linux only).
[[test]]
name = "linux_sweep"
harness = false
