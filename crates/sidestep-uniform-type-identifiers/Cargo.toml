[package]
name = "sidestep-uniform-type-identifiers"
description = "Uniform type identifiers for Sidestep"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
sidestep-runtime.workspace = true
sidestep-foundation.workspace = true
objc2 = { workspace = true, features = ["gnustep-2-1"] }
objc2-foundation = { workspace = true, features = ["gnustep-2-1", "NSArray", "NSDictionary", "NSSet", "NSString", "NSValue", "NSURL", "NSBundle"] }
