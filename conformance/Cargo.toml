[package]
name = "sidestep-conformance"
description = "Tests written only against objc2, run on macOS (Apple's runtime) and Linux (Sidestep) alike"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSThread", "NSZone", "NSGeometry", "NSDictionary", "NSEnumerator"] }
objc2-app-kit = { workspace = true, features = ["NSResponder", "NSView", "NSClipView", "NSScrollView"] }
sidestep.workspace = true

# AppKit belongs to the main thread, which the test harness doesn't run on.
[[test]]
name = "appkit"
harness = false

# Input, windows and pasteboards (appkit_input).
[dev-dependencies]
objc2-app-kit = { workspace = true, features = ["NSEvent", "NSWindow", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSResponder", "NSView", "NSCursor", "NSColor", "objc2-core-foundation"] }

[[test]]
name = "appkit_input"
harness = false

[[test]]
name = "appkit_keybindings"
harness = false
