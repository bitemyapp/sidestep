[package]
name = "sidestep-conformance"
description = "Tests written only against objc2, run on macOS (Apple's runtime) and Linux (Sidestep) alike"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSThread", "NSZone", "NSGeometry", "NSDictionary", "NSEnumerator", "NSArray", "NSSet", "NSValue", "NSNull", "NSRange", "NSObjCRuntime", "block2", "NSIndexSet", "NSAttributedString", "NSCharacterSet", "NSScanner", "NSPathUtilities", "NSRegularExpression", "NSTextCheckingResult", "NSLocale", "NSError", "objc2-core-foundation", "NSRunLoop", "NSTimer", "NSDate", "NSNotification", "NSOperation", "NSData", "NSURL", "NSFileManager", "NSProcessInfo", "NSUUID", "NSBundle", "NSPropertyList", "NSUserDefaults", "NSLock", "NSJSONSerialization", "NSFormatter", "NSDateFormatter", "NSTimeZone", "NSInvocation", "NSMethodSignature", "NSProxy", "NSOrderedSet", "NSSortDescriptor", "NSHashTable", "NSMapTable", "NSPointerFunctions", "NSPointerArray", "NSCache", "NSKeyValueCoding"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "objc2", "block2", "CFRunLoop", "CFDate", "CFString", "CFData", "CFURL", "CFError", "CFPreferences", "CFDictionary", "CFArray", "CFNumber", "CFPropertyList", "CFCGTypes"] }
objc2-core-graphics = { workspace = true, features = ["CGAffineTransform", "CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGDataConsumer", "CGDataProvider", "CGFont", "CGFunction", "CGGeometry", "CGGradient", "CGImage", "CGPath", "CGPattern", "CGShading", "bitflags", "block2", "objc2"] }
objc2-app-kit = { workspace = true, features = ["NSResponder", "NSView", "NSClipView", "NSScrollView", "NSEvent", "NSFont", "NSFontDescriptor", "NSParagraphStyle", "NSText", "NSStringDrawing", "NSAttributedString", "NSColor", "NSCell", "objc2-core-foundation"] }
dispatch2 = "0.3.1"
sidestep.workspace = true

# Apple raises NSExceptions where Sidestep panics; tests catch them to read
# the reason.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true, features = ["exception"] }

# AppKit belongs to the main thread, which the test harness doesn't run on.
[[test]]
name = "appkit"
harness = false

# Input, windows and pasteboards (appkit_input).
[dev-dependencies]
objc2-app-kit = { workspace = true, features = ["NSEvent", "NSWindow", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSResponder", "NSView", "NSCursor", "NSColor", "NSTrackingArea", "NSTextInputClient", "NSTextInputContext", "NSWindowScripting", "NSApplication", "block2", "objc2-core-foundation", "NSImageRep", "NSBitmapImageRep", "NSColorSpace", "NSBezierPath", "NSAffineTransform", "NSAppearance", "NSImage", "NSGradient", "NSShadow", "NSAnimation", "NSAnimationContext", "NSCustomImageRep", "NSColorList", "NSVisualEffectView", "NSCell", "NSFontDescriptor", "NSRunningApplication", "NSPanel", "NSViewController", "NSWindowController", "NSStoryboard", "NSNib", "NSPasteboardItem", "NSDragging", "NSScreen", "NSControl", "NSActionCell", "NSButton", "NSButtonCell", "NSTextField", "NSTextFieldCell", "NSSecureTextField", "NSSearchField", "NSSearchFieldCell", "NSBox", "NSProgressIndicator", "NSSegmentedControl", "NSSegmentedCell", "NSStepper", "NSStepperCell", "NSSlider", "NSSliderCell", "NSSwitch", "NSLayoutConstraint", "NSUserInterfaceLayout", "NSText", "NSParagraphStyle", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSUserInterfaceItemIdentification", "NSScrollView", "NSClipView", "NSLayoutAnchor", "NSLayoutGuide", "NSStackView", "NSSplitView", "NSTabView", "NSTabViewItem", "NSTableView", "NSTableColumn", "NSTableRowView", "NSTableCellView", "NSTableHeaderView", "NSTextStorage", "NSTextStorageScripting", "NSLayoutManager", "NSTextContainer", "NSTextView", "NSTextTable", "NSFont", "NSAttributedString", "NSScroller", "NSMenu", "NSMenuItem", "NSUserInterfaceValidation", "NSPopUpButton", "NSPopUpButtonCell", "NSMenuItemCell", "NSAlert", "NSSavePanel", "NSOpenPanel", "NSWorkspace", "NSAccessibility", "libc", "NSImageView", "NSImageCell", "NSStringDrawing", "NSDraggingItem", "NSHelpManager", "NSFontManager", "objc2-core-graphics", "NSTextContentManager", "NSTextElement", "NSTextRange", "NSTextLayoutManager", "NSTextLayoutFragment", "NSTextLineFragment", "NSTextViewportLayoutController", "NSTextSelection", "NSTextSelectionNavigation"] }
objc2-foundation = { workspace = true, features = ["NSRange", "NSAttributedString", "NSAffineTransform", "NSData", "NSArray", "NSValue", "NSGeometry", "NSIndexSet", "NSNotification", "NSUserDefaults", "NSUndoManager", "NSInvocation", "NSMethodSignature", "NSRunLoop", "NSDate", "NSString", "NSDictionary", "NSURL", "NSError", "NSBundle", "NSException", "NSExtensionContext", "NSFileManager", "NSItemProvider", "NSLocale", "NSOperation", "NSProcessInfo", "NSProgress", "NSTextCheckingResult", "NSUserActivity", "NSZone", "NSObjCRuntime", "NSObject", "NSThread"] }
objc2-core-graphics = { workspace = true, features = ["CGContext"] }

[[test]]
name = "appkit_input"
harness = false

# Controls, without a window and with one that is never shown.
[[test]]
name = "controls"
harness = false

[[test]]
name = "control_events"
harness = false

[[test]]
name = "appkit_keybindings"
harness = false

# The event loop, notifications and window behaviour (appkit_events), and
# the same with windows on screen, opt-in (appkit_windows).
[[test]]
name = "appkit_events"
harness = false

[[test]]
name = "appkit_windows"
harness = false

[[test]]
name = "text"
harness = false

# Attributed strings measured and drawn, and read and written as RTF,
# RTFD, HTML and plain text (rich_text), on the main thread.
[[test]]
name = "attributed_drawing"
harness = false

[[test]]
name = "rich_text"
harness = false

# Run loops: the main thread's loop behaves differently from others'.
[[test]]
name = "runloop"
harness = false

# Observers on the main operation queue need the main thread.
[[test]]
name = "notifications"
harness = false

# The first thread start of the process posts a notification.
[[test]]
name = "threads"
harness = false

# The main dispatch queue needs the main thread.
[[test]]
name = "dispatch"
harness = false

# One process's defaults: environment set up first, and a child process.
[[test]]
name = "defaults"
harness = false

# Pasteboards, drag and drop, screens and controls.
[[test]]
name = "drag_defaults"
harness = false

[[test]]
name = "screen"
harness = false

# Drawing, colors and appearances, images and animation contexts (drawing,
# color_appearance, images, animation): pixels read back from bitmaps, no
# window needed.
[[test]]
name = "drawing"
harness = false

[[test]]
name = "color_appearance"
harness = false

[[test]]
name = "images"
harness = false

[[test]]
name = "animation"
harness = false

# Containers: the view contract, Auto Layout, stack, split, tab and table
# views (appkit_views, appkit_autolayout, appkit_stack, appkit_split,
# appkit_tab, appkit_table).
[[test]]
name = "appkit_views"
harness = false

[[test]]
name = "appkit_autolayout"
harness = false

[[test]]
name = "appkit_stack"
harness = false

[[test]]
name = "appkit_split"
harness = false

[[test]]
name = "appkit_tab"
harness = false

[[test]]
name = "appkit_table"
harness = false

# Cells and table rows honouring background styles (cell_backgrounds).
[[test]]
name = "cell_backgrounds"
harness = false

# Text editing: text storage and layout run on any thread (text_storage,
# text_layout use the default harness); undo and text views need the main
# thread.
[[test]]
name = "undo_manager"
harness = false

[[test]]
name = "text_view"
harness = false

# TextKit 2 text views need the main thread too (textkit2 doesn't).
[[test]]
name = "textkit2_view"
harness = false

# Scroll views, clip views and scrollers (appkit_scroll); menus, pop-up
# buttons, alerts and panels (menus, popup_button, alert, panels).
[[test]]
name = "appkit_scroll"
harness = false

[[test]]
name = "menus"
harness = false

[[test]]
name = "popup_button"
harness = false

[[test]]
name = "alert"
harness = false

[[test]]
name = "panels"
harness = false

# AppKit's CoreGraphics bridges (coregraphics_appkit; coregraphics, which
# needs no AppKit, uses the default harness).
[[test]]
name = "coregraphics_appkit"
harness = false

# Image views and images in controls (image_views, control_images).
[[test]]
name = "image_views"
harness = false

[[test]]
name = "control_images"
harness = false

# The funnels: AppKit methods other methods reach by message, each seen
# through a subclass's override (funnels).
[[test]]
name = "funnels"
harness = false

# What programs reach at link time and at launch: data symbols, classes
# made at launch, and the small gaps around them (contract_sweep).
[[test]]
name = "contract_sweep"
harness = false

# Selectors an application census found present, asked of real instances
# (census_selectors).
[[test]]
name = "census_selectors"
harness = false
