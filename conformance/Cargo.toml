[package]
name = "sidestep-conformance"
description = "Tests written only against objc2, run on macOS (Apple's runtime) and Linux (Sidestep) alike"
version = "0.0.0"
edition.workspace = true
publish = false

[dependencies]
objc2.workspace = true
block2.workspace = true
objc2-foundation = { workspace = true, features = ["NSString", "NSObject", "NSThread", "NSZone", "NSGeometry", "NSDictionary", "NSEnumerator", "NSArray", "NSSet", "NSValue", "NSNull", "NSRange", "NSObjCRuntime", "block2", "NSIndexSet"] }
objc2-app-kit = { workspace = true, features = ["NSResponder", "NSView", "NSClipView", "NSScrollView"] }
sidestep.workspace = true

# Apple raises NSExceptions where Sidestep panics; tests catch them to read
# the reason.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = { workspace = true, features = ["exception"] }

# AppKit belongs to the main thread, which the test harness doesn't run on.
[[test]]
name = "appkit"
harness = false
