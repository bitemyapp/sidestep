name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The same conformance tests run everywhere: on macOS against Apple's
  # runtime, on Linux against Sidestep's.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # objc2's crates with the fork's fixes, for [patch.crates-io].
      - run: cargo run --release --manifest-path tools/objc2-overlay/Cargo.toml
      - run: cargo test --workspace
      - run: cargo test --workspace --release

  # Under a real compositor: AppKit's and the native toolkit's system tests
  # run in the container scripts/linux-cargo builds in (sway, wtype and
  # wl-clipboard from scripts/linux.Dockerfile), under a headless sway, with
  # other clients on the other side of the clipboard, drags, keys and a
  # virtual pointer. (The test job runs them too, but without a display
  # they say so and pass.)
  wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/linux-run scripts/headless-wayland cargo test -p sidestep-ui --test wayland_system
      - run: scripts/linux-run scripts/headless-wayland cargo test -p sidestep-appkit --test wayland_system

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo run --release --manifest-path tools/objc2-overlay/Cargo.toml
      - run: cargo test --release --manifest-path tools/objc2-overlay/Cargo.toml
      # The link-closure tests (crates/sidestep/tests/link_closure*.rs, run
      # by the test job) must name what the overlay declares today, each
      # file the script writes checked in (a new group's too).
      - run: |
          python3 scripts/link-closure
          git status --porcelain crates/sidestep/tests
          test -z "$(git status --porcelain crates/sidestep/tests)"
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/objc2-overlay/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/objc2-overlay/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets -- -D warnings
